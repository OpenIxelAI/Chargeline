<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChargeLine</title>
<meta name="description" content="EV trip planner for a Tesla with adapters: Superchargers plus the CCS and Level 2 chargers your adapters unlock, planned charging stops, live GPS guidance and Google Maps hand-off.">
<meta name="theme-color" content="#F7F9FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChargeLine">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2300926F'/%3E%3Cpath d='M18 5 9 18h6l-2 9 10-14h-6z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  /* Layout: map-first canvas. Wide screens dock the trip panel on the left (Google Maps style);
     phones get a floating search card on top and a snap-point bottom sheet. Battery % is the visual language. */
  --bg:#E6ECF1;
  --panel:#F7F9FB;
  --card:#FFFFFF;
  --ink:#0F1923;
  --ink-2:#465463;
  --ink-3:#738291;
  --line:#D8E0E7;
  --hover:#ECF1F6;
  --route:#1764E8;
  --on-route:#FFFFFF;
  --route-casing:#FFFFFF;
  --route-alt:#9AA8B6;
  --nav-bg:#0C3B8A;
  --volt:#00926F;
  --native:#C8102E;
  --adapter:#6447EE;
  --level2:#2A8C3E;
  --none:#9AA5B1;
  --warn:#B4470B;
  --warn-bg:#FFF1E3;
  --soc-lo:#E0484D;
  --soc-mid:#E3A21A;
  --soc-hi:#12A07D;
  --shadow-1:0 1px 2px rgba(15,25,35,.10),0 2px 10px rgba(15,25,35,.07);
  --shadow-2:0 2px 6px rgba(15,25,35,.14),0 16px 40px rgba(15,25,35,.18);
  --font-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --panel-w:420px;
  --sheet-h:168px;
  --top-h:0px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F14;--panel:#0F151C;--card:#161E27;--ink:#E6ECF2;--ink-2:#A6B2BF;--ink-3:#748391;--line:#25313D;--hover:#1C2631;
    --route:#5B95FF;--on-route:#06142E;--route-casing:#08172E;--route-alt:#5E6B78;--nav-bg:#0B2E6B;
    --volt:#2ED3A6;--native:#FF4B5C;--adapter:#9C8BFF;--level2:#4FC86A;--none:#5E6B78;--warn:#FF8A4C;--warn-bg:#2A1A10;
    --soc-lo:#FF5A60;--soc-mid:#F2B532;--soc-hi:#2ED3A6;
    --shadow-1:0 1px 2px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.3);--shadow-2:0 2px 6px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F14;--panel:#0F151C;--card:#161E27;--ink:#E6ECF2;--ink-2:#A6B2BF;--ink-3:#748391;--line:#25313D;--hover:#1C2631;
  --route:#5B95FF;--on-route:#06142E;--route-casing:#08172E;--route-alt:#5E6B78;--nav-bg:#0B2E6B;
  --volt:#2ED3A6;--native:#FF4B5C;--adapter:#9C8BFF;--level2:#4FC86A;--none:#5E6B78;--warn:#FF8A4C;--warn-bg:#2A1A10;
  --soc-lo:#FF5A60;--soc-mid:#F2B532;--soc-hi:#2ED3A6;
  --shadow-1:0 1px 2px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.3);--shadow-2:0 2px 6px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--route)}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i .f{fill:currentColor;stroke:none}
svg.s{width:16px;height:16px}

/* ---------- layout ---------- */
.app{height:100%;display:grid;grid-template-columns:var(--panel-w) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.topcard{grid-column:1;grid-row:1;background:var(--panel);padding:14px 16px 10px;border-right:1px solid var(--line);position:relative;z-index:700}
.sheet{grid-column:1;grid-row:2;background:var(--panel);border-right:1px solid var(--line);min-height:0;display:flex;flex-direction:column;position:relative;z-index:600}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 40px}
.handle{display:none}
.mapwrap{grid-column:2;grid-row:1/3;position:relative;min-width:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg)}

/* brand row */
.brand{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px;margin-right:auto;font:700 24px/1 var(--font-display);letter-spacing:.01em;white-space:nowrap}
.logo .mark{width:28px;height:28px;border-radius:50%;background:var(--volt);color:var(--panel);display:grid;place-items:center}
.logo .mark svg{width:17px;height:17px}
.car-chip{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:230px;height:34px;padding:0 12px 0 9px;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:13px;color:var(--ink-2)}
.car-chip b{color:var(--ink)}
.car-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:38px;height:38px;flex:none;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.compact-line{display:none}

/* search */
.search{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr) 38px;gap:8px;align-items:center}
.rail{grid-column:1;grid-row:1/3;align-self:stretch;display:flex;flex-direction:column;align-items:center;padding:17px 0}
.r-from{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--ink-2);background:var(--card);flex:none}
.r-dots{flex:1;border-left:2px dotted var(--ink-3);margin:4px 0}
.r-to{width:12px;height:12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ink);flex:none}
.field{grid-column:2;display:flex;align-items:center;gap:2px;height:46px;padding:0 4px 0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
.field:focus-within{border-color:var(--route);box-shadow:0 0 0 3px color-mix(in srgb,var(--route) 20%,transparent)}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:16px}
.field input::placeholder{color:var(--ink-3)}
.field .icon-btn{width:36px;height:36px}
.swap{grid-column:3;grid-row:1/3}
.tripopts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:13px;color:var(--ink-2)}
.pill input,.pill select{border:0;background:transparent;outline:0;font-size:13px;color:var(--ink);min-width:0}

.suggest{position:absolute;left:26px;right:46px;z-index:30;margin:0;padding:6px 0;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);max-height:min(60vh,420px);overflow:auto}
.suggest li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:center;padding:9px 14px;cursor:pointer}
.suggest li[aria-selected="true"],.suggest li:hover{background:var(--hover)}
.suggest .s-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest .s-s{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest .s-i{color:var(--ink-3);display:grid;place-items:center}
.suggest li.s-note{display:block;color:var(--ink-3);cursor:default;font-size:14px}
.suggest li.s-note:hover{background:none}

/* battery strip */
.battery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 0;padding:12px 14px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.bat label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.bat output{display:block;font:600 28px/1.05 var(--font-display);font-variant-numeric:tabular-nums}
.bat input[type=range]{width:100%;margin:4px 0 0;accent-color:var(--volt)}

/* status line */
.status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
.status:not(:empty){padding:12px 0 2px}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--route) 25%,transparent);border-top-color:var(--route);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.results.dim{opacity:.45;pointer-events:none;transition:opacity .2s}

/* generic */
.sec{margin-top:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 8px}
.sec-h h3{margin:0;font:700 12px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sec-h .muted{font-size:13px;text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--route);border-color:var(--route);color:var(--on-route)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{height:32px;padding:0 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--route)}
.btn.danger{background:var(--native);border-color:var(--native);color:#fff}
.link-btn{border:0;background:none;padding:0;color:var(--route);font-weight:700;font-size:13px}

/* summary */
.summary{padding-top:14px}
.sum-main{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sum-time{font:700 44px/1 var(--font-display);letter-spacing:-.01em}
.sum-dist{font:600 24px/1 var(--font-display);color:var(--ink-2)}
.sum-sub{margin-top:6px;color:var(--ink-2);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font:600 24px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-3)}
.kpi.ok b{color:var(--volt)}
.kpi.low b{color:var(--warn)}
.kpi.bad b{color:var(--native)}
.routeopts{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px}
.ropt{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;text-align:left;font-size:13px;color:var(--ink-2)}
.ropt b{display:block;font:600 18px/1.1 var(--font-display);color:var(--ink)}
.ropt[aria-pressed="true"]{border-color:var(--route);box-shadow:inset 0 0 0 1px var(--route)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px;color:var(--ink-3);align-items:center}
.banner{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--ink);font-size:14px;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner svg{color:var(--warn);margin-top:1px}
.banner.info{background:var(--card);border-color:var(--line)}
.banner.info svg{color:var(--route)}
.banner p{margin:0}
.banner p+p{margin-top:4px}

/* battery ribbon chart */
.ribbon{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px 4px}
.ribbon svg{display:block;width:100%;height:136px}
.rb-grid{stroke:var(--line);stroke-width:1}
.rb-res{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:4 4}
.rb-lab{fill:var(--ink-3);font:600 11px var(--font-display)}
.rb-line{fill:none;stroke-width:2.4;stroke-linejoin:round}
.rb-area{opacity:.22}
.g-hi{stop-color:var(--soc-hi)}.g-mid{stop-color:var(--soc-mid)}.g-lo{stop-color:var(--soc-lo)}
.rb-stop{stroke:var(--card);stroke-width:2}
.rb-num{fill:#fff;font:700 10px var(--font-display)}
.cond{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 6px 4px;font-size:13px;color:var(--ink-2)}
.cond b{color:var(--ink)}

/* itinerary */
.itin{list-style:none;margin:0;padding:0;position:relative}
.itin::before{content:"";position:absolute;left:17px;top:14px;bottom:14px;border-left:3px solid var(--line)}
.it{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;position:relative}
.it-mark{display:flex;justify-content:center;padding-top:2px}
.mk{width:20px;height:20px;border-radius:50%;background:var(--card);border:4px solid var(--ink);position:relative;z-index:1}
.mk.to{border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ink);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.mk.stop{width:32px;height:32px;margin-top:-4px;border:3px solid var(--panel);background:var(--c);color:#fff;display:grid;place-items:center;font:700 16px/1 var(--font-display);text-shadow:0 1px 1px rgba(0,0,0,.3)}
.it-body{min-width:0;padding-bottom:6px}
.it-title{font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.it-meta{font-size:13px;color:var(--ink-2);margin-top:2px}
.it-stop .it-body{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.it-net{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.it-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.it-charge{font:700 22px/1 var(--font-display);white-space:nowrap}
.socbar{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font:600 15px/1 var(--font-display);font-variant-numeric:tabular-nums}
.socbar .bar{flex:1;height:8px;border-radius:4px;background:var(--hover);position:relative;overflow:hidden}
.socbar .bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.socbar .bar i.a{background:var(--line)}
.socbar .bar i.b{background:var(--volt)}
.it-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.it-leg .it-body{font-size:13px;color:var(--ink-3);padding:2px 0 10px}
.it-leg .it-body b{color:var(--ink-2);font-weight:700}
.it-leg.warn .it-body{color:var(--warn)}
.conns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.conn{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 5px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.conn svg{width:16px;height:16px}
.conn.ok{border-color:color-mix(in srgb,var(--volt) 45%,var(--line));color:var(--ink)}
.conn.no{opacity:.55;text-decoration:line-through}

/* chargers list */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink-2)}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.clist{list-style:none;margin:6px 0 0;padding:0}
.citem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cmile{font:600 17px/1 var(--font-display);text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cmile small{display:block;font-size:11px;color:var(--ink-3);font-weight:500}
.cname{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;padding:0;text-align:left;max-width:100%;display:block}
.cname:hover{text-decoration:underline}
.cmeta{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cmeta .dot{width:8px;height:8px}
.cadd{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink-2)}
.cadd[aria-pressed="true"]{background:var(--volt);border-color:var(--volt);color:var(--panel)}

/* directions */
details.dirs{border:1px solid var(--line);border-radius:14px;background:var(--card)}
details.dirs>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;font-weight:700}
details.dirs>summary::-webkit-details-marker{display:none}
details.dirs[open]>summary svg{transform:rotate(180deg)}
.dlist{list-style:none;margin:0;padding:0 14px 8px}
.dleg{font:700 12px/1.2 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:12px 0 4px}
.dstep{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.dstep .mi{width:24px;height:24px;color:var(--ink-2)}
.dstep .dd{font-size:12px;color:var(--ink-3);white-space:nowrap;padding-top:2px}
.sh{display:inline-grid;place-items:center;vertical-align:-6px;position:relative;margin:0 2px}
.sh-i{width:24px;height:24px}
.sh-i svg{position:absolute;inset:0;width:100%;height:100%}
.sh-i .sh-b{fill:#1C4FA1;stroke:#fff;stroke-width:1}
.sh-i .sh-t{fill:#C8102E}
.sh-i b{position:relative;color:#fff;font:700 10.5px/1 var(--font-display);margin-top:3px}
.sh-i.d3 b{font-size:9px}
.sh-us{min-width:22px;height:22px;padding:0 3px;background:#fff;color:#111;border:1.5px solid #111;border-radius:4px 4px 10px 10px;font:700 11px/1 var(--font-display)}
.sh-st{min-width:24px;height:20px;padding:0 4px;background:#fff;color:#111;border:1.5px solid #111;border-radius:50%;font:700 11px/1 var(--font-display)}
.sh-x{padding:1px 5px;border:1px solid var(--line);border-radius:4px;font-size:12px;vertical-align:0}

/* empty state */
.empty h2{margin:18px 0 6px;font:700 30px/1.05 var(--font-display)}
.empty p{margin:0 0 12px;color:var(--ink-2);max-width:60ch}
.carcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.carcard select{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 10px}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.3}
.chk input{margin-top:2px;width:18px;height:18px;accent-color:var(--volt);flex:none}
.chk small{display:block;color:var(--ink-3);font-size:12px}
.reclist{list-style:none;margin:0;padding:0}
.reclist li{border-top:1px solid var(--line)}
.reclist button{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:10px 2px;border:0;background:none;text-align:left}
.reclist button:hover{background:var(--hover)}
.reclist .t{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reclist .s{display:block;font-size:13px;color:var(--ink-3)}
.foot{margin-top:26px;font-size:12px;color:var(--ink-3);line-height:1.5}
.foot a{color:inherit}

/* map overlays */
.map-chips{position:absolute;z-index:500;top:12px;left:12px;right:12px;display:flex;gap:8px;overflow-x:auto;pointer-events:none;padding:2px}
.map-chips>*{pointer-events:auto}
.mchip{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-1);font-size:13px;font-weight:700;color:var(--ink-2)}
.mchip[aria-pressed="false"]{color:var(--ink-3);font-weight:400}
.mchip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.fabs{position:absolute;z-index:500;right:12px;bottom:104px;display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-2);box-shadow:var(--shadow-1);display:grid;place-items:center}
.fab:hover{color:var(--ink)}
.layer-menu{position:absolute;right:58px;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:6px;display:grid;gap:2px;min-width:150px}
.layer-menu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px}
.layer-menu button[aria-pressed="true"]{background:var(--hover);font-weight:700}

/* leaflet skin */
.leaflet-container{font:inherit;background:var(--bg)}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--card);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow-1)!important;border-radius:12px!important;overflow:hidden}
.leaflet-control-attribution{background:color-mix(in srgb,var(--card) 80%,transparent)!important;color:var(--ink-3)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border-radius:14px;box-shadow:var(--shadow-2)}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content{margin:14px 16px;font:14px/1.45 var(--font-body);min-width:230px}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink-3);top:6px;right:6px}
.pop .p-net{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c);padding-right:18px}
.pop h4{margin:4px 0 2px;font:700 20px/1.15 var(--font-display)}
.pop .p-spec{font:600 16px/1.3 var(--font-display);color:var(--ink)}
.pop .p-addr,.pop .p-meta{font-size:13px;color:var(--ink-2);margin-top:4px}
.pop .p-meta{color:var(--ink-3)}
.pop .p-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pop .p-act .btn{height:32px;padding:0 12px;font-size:13px}
.pin-ic,.stop-ic,.me-ic{background:none;border:0}
.pt-from{width:20px;height:20px;border-radius:50%;background:var(--card);border:5px solid var(--ink);box-shadow:var(--shadow-1)}
.pt-to{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ink);border:3px solid var(--card);box-shadow:var(--shadow-1);display:grid;place-items:center}
.pt-to::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--card)}
.stop-pin{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:var(--shadow-1);display:grid;place-items:center;color:#fff;font:700 17px/1 var(--font-display);text-shadow:0 1px 1px rgba(0,0,0,.35)}
.stop-tag{position:absolute;top:37px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font:600 13px/1.3 var(--font-display);box-shadow:var(--shadow-1)}
.zlow .stop-tag{display:none}
.me-dot{width:18px;height:18px;border-radius:50%;background:var(--route);border:3px solid var(--card);box-shadow:0 0 0 7px color-mix(in srgb,var(--route) 22%,transparent)}
.nav-arrow{width:52px;height:52px;display:grid;place-items:center;transition:transform .5s linear;border-radius:50%;background:color-mix(in srgb,var(--route) 18%,transparent)}
.nav-arrow svg{width:40px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.nav-arrow .na{fill:var(--route);stroke:var(--card);stroke-width:1.6}
.drop-pop .p-act{margin-top:0}

/* drive mode */
.drive{position:absolute;inset:0;z-index:900;pointer-events:none}
.drive>*{pointer-events:auto}
.nav-banner{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto;background:var(--nav-bg);color:#fff;border-radius:18px;box-shadow:var(--shadow-2);display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:12px 16px 12px 12px}
.nav-icon{width:58px;height:58px;display:grid;place-items:center}
.nav-icon svg{width:52px;height:52px;color:#fff}
.nav-dist{font:700 34px/1 var(--font-display);font-variant-numeric:tabular-nums}
.nav-text{font-size:18px;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.nav-then{position:absolute;top:calc(env(safe-area-inset-top,0px) + 116px);left:max(16px,env(safe-area-inset-left,0px));background:var(--nav-bg);color:#fff;border-radius:12px;padding:6px 12px;font-size:14px;box-shadow:var(--shadow-1);filter:brightness(.85)}
.nav-bottom{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:560px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:18px;box-shadow:var(--shadow-2);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.nav-eta b{font:700 30px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--volt)}
.nav-eta span{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
.nav-next{grid-column:1/-1;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px}
.nav-next b{color:var(--ink)}
.nav-btns{display:flex;gap:8px;align-items:center}
.recenter{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:auto;padding:0 16px;border-radius:999px;font-weight:700;display:flex;gap:8px}
body.driving .topcard,body.driving .sheet,body.driving .map-chips,body.driving .fabs,body.driving .leaflet-control-zoom{display:none}
body.driving .app{grid-template-columns:0 minmax(0,1fr)}
body.driving .leaflet-bottom.leaflet-right{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 112px)}

/* settings dialog */
dialog{border:0;padding:0;border-radius:18px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow-2);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(5,10,15,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font:700 24px/1 var(--font-display)}
.dlg-b{overflow:auto;padding:4px 20px 20px}
.dlg-b fieldset{border:0;margin:16px 0 0;padding:0;display:grid;gap:10px}
.dlg-b legend{font:700 12px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;padding:0}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:center;font-size:14px}
.frow small{display:block;color:var(--ink-3);font-size:12px}
.frow input,.frow select{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;font-size:14px}
.frow.stack{grid-template-columns:1fr;gap:6px}
.keyrow{display:flex;gap:8px;align-items:center}
.keyrow input{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.keystat{font-size:13px;color:var(--ink-2);min-height:1.3em}
.keystat.ok{color:var(--volt);font-weight:700}
.keystat.bad{color:var(--warn)}
.frow input[type=checkbox]{width:20px;height:20px;justify-self:end;accent-color:var(--volt)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dlg-f{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:2000;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-2);transition:opacity .2s,transform .2s;pointer-events:none;max-width:min(92vw,520px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- phone layout ---------- */
@media (max-width: 899px){
  .app{display:block;position:relative}
  .mapwrap{position:absolute;inset:0}
  .topcard{position:absolute;top:0;left:0;right:0;margin:calc(env(safe-area-inset-top,0px) + 8px) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-2);padding:10px 12px}
  .brand{margin-bottom:8px}
  .logo{font-size:21px}
  .car-chip{max-width:170px}
  .topcard.compact .brand,.topcard.compact .search,.topcard.compact .tripopts{display:none}
  .topcard.compact{padding:4px 6px 4px 12px}
  .topcard.compact .compact-line{display:flex;align-items:center;gap:8px}
  .compact-line button.cl-trip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 0;text-align:left;font-weight:700;font-size:15px}
  .compact-line .cl-trip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet{position:absolute;left:0;right:0;bottom:0;height:var(--sheet-h);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:var(--shadow-2);transition:height .28s cubic-bezier(.2,.8,.2,1)}
  .sheet.dragging{transition:none}
  .handle{display:flex;justify-content:center;align-items:center;height:26px;flex:none;cursor:grab;touch-action:none;border:0;background:none;width:100%}
  .handle span{width:42px;height:5px;border-radius:3px;background:var(--line)}
  .sheet-body{padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .summary{padding-top:2px}
  .sum-time{font-size:38px}
  .map-chips{top:calc(var(--top-h) + 8px);left:8px;right:8px}
  .fabs{right:10px;bottom:calc(var(--sheet-h) + 12px)}
  .leaflet-control-zoom{display:none}
  .leaflet-bottom{bottom:var(--sheet-h)}
  .suggest{left:0;right:0}
  .battery{gap:8px;padding:10px 12px 8px}
  .bat output{font-size:24px}
}
@media (max-width: 380px){
  .kpi b{font-size:20px}
  .car-chip{max-width:130px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation-duration:.01ms!important}
}

<body>
<div class="app" id="app">
  <header class="topcard" id="topcard">
    <div class="brand">
      <div class="logo"><span class="mark"><svg viewBox="0 0 24 24" class="i" aria-hidden="true"><path class="f" d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span><span>ChargeLine</span></div>
      <button class="car-chip" id="carChip" type="button" aria-label="Vehicle and adapter settings"></button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings"></button>
    </div>
    <div class="compact-line">
      <button class="cl-trip" id="compactTrip" type="button"></button>
      <button class="icon-btn" id="compactSettings" type="button" aria-label="Settings"></button>
    </div>
    <div class="search" id="search">
      <div class="rail" aria-hidden="true"><span class="r-from"></span><span class="r-dots"></span><span class="r-to"></span></div>
      <div class="field">
        <input id="fromInput" type="text" placeholder="Choose starting point" autocomplete="off" spellcheck="false" enterkeyhint="next" aria-label="Starting point" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
        <button class="icon-btn" id="locateFrom" type="button" aria-label="Use my location as the start"></button>
      </div>
      <div class="field">
        <input id="toInput" type="text" placeholder="Choose destination" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-label="Destination" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
      </div>
      <button class="icon-btn swap" id="swapBtn" type="button" aria-label="Swap start and destination"></button>
      <ul class="suggest" id="suggest" role="listbox" hidden></ul>
    </div>
    <div class="tripopts">
      <label class="pill" for="departAt"><span>Leave</span><input id="departAt" type="datetime-local"></label>
    </div>
  </header>

  <aside class="sheet" id="sheet" aria-label="Trip">
    <button class="handle" id="handle" type="button" aria-label="Resize panel"><span></span></button>
    <div class="sheet-body" id="sheetBody">
      <div class="battery" id="battery">
        <div class="bat"><label for="socNow">Battery now</label><output id="socNowOut" for="socNow">80%</output><input id="socNow" type="range" min="1" max="100" step="1"></div>
        <div class="bat"><label for="maxCharge">Charge to</label><output id="maxChargeOut" for="maxCharge">80%</output><input id="maxCharge" type="range" min="50" max="100" step="5"></div>
        <div class="bat"><label for="destReserve">Arrive with</label><output id="destReserveOut" for="destReserve">15%</output><input id="destReserve" type="range" min="0" max="60" step="1"></div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="results" id="results"></div>
    </div>
  </aside>

  <main class="mapwrap" id="mapwrap">
    <div id="map" role="application" aria-label="Map"></div>
    <div class="map-chips" id="mapChips" aria-label="Charger filters"></div>
    <div class="fabs">
      <div style="position:relative">
        <button class="fab" id="layersBtn" type="button" aria-label="Map style" aria-expanded="false"></button>
        <div class="layer-menu" id="layerMenu" hidden></div>
      </div>
      <button class="fab" id="locateBtn" type="button" aria-label="Show my location"></button>
    </div>
    <div class="drive" id="drive" hidden>
      <div class="nav-banner" id="navBanner">
        <div class="nav-icon" id="navIcon"></div>
        <div><div class="nav-dist" id="navDist">—</div><div class="nav-text" id="navText">Getting your location…</div></div>
      </div>
      <div class="nav-then" id="navThen" hidden></div>
      <button class="fab recenter" id="recenterBtn" type="button" hidden></button>
      <div class="nav-bottom">
        <div class="nav-eta"><b id="navEta">—</b><span id="navRemain">—</span></div>
        <div class="nav-btns">
          <button class="icon-btn" id="voiceBtn" type="button" aria-label="Voice guidance" aria-pressed="true"></button>
          <button class="btn danger" id="endBtn" type="button">End</button>
        </div>
        <div class="nav-next" id="navNext"></div>
      </div>
    </div>
  </main>
</div>

<dialog id="settingsDlg" aria-labelledby="setTitle">
  <form method="dialog" class="dlg" id="settingsForm">
    <div class="dlg-h"><h2 id="setTitle">Settings</h2><button class="icon-btn" value="close" aria-label="Close settings" id="setClose"></button></div>
    <div class="dlg-b">
      <fieldset>
        <legend>Your car</legend>
        <div class="frow stack"><label for="setVehicle">Model</label><select id="setVehicle" data-set="vehicle"></select></div>
        <div id="customCar" class="grid2" hidden>
          <div class="frow" style="grid-template-columns:1fr"><label for="setKwh">Usable battery (kWh)<input id="setKwh" type="number" min="20" max="200" step="0.5" data-set="custom.kwh"></label></div>
          <div class="frow" style="grid-template-columns:1fr"><label for="setWhmi">Highway use (Wh/mi)<input id="setWhmi" type="number" min="150" max="700" step="5" data-set="custom.whmi"></label></div>
          <div class="frow" style="grid-template-columns:1fr"><label for="setPeak">Peak DC charging (kW)<input id="setPeak" type="number" min="40" max="400" step="5" data-set="custom.peak"></label></div>
          <div class="frow" style="grid-template-columns:1fr"><label for="setChem">Battery type<select id="setChem" data-set="custom.chem"><option value="nmc">NCA / NMC (Long Range)</option><option value="lfp">LFP (RWD)</option></select></label></div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Adapters you carry</legend>
        <label class="chk"><input type="checkbox" id="setCcs" data-set="adapters.ccs"><span><b>CCS1 → NACS</b> (DC fast)<small>Electrify America, EVgo, ChargePoint DC and other CCS stations. Your car must show “CCS Adapter Support: Enabled” under Controls → Software → Additional Vehicle Information.</small></span></label>
        <label class="chk"><input type="checkbox" id="setJ1772" data-set="adapters.j1772"><span><b>J1772 → NACS</b> (Level 2)<small>Most public Level 2 posts. Ships with most Teslas.</small></span></label>
        <label class="chk"><input type="checkbox" id="setChademo" data-set="adapters.chademo"><span><b>CHAdeMO</b> (DC, older stations)<small>Rare and slow, about 50 kW.</small></span></label>
      </fieldset>
      <fieldset>
        <legend>Planning</legend>
        <div class="frow"><label for="setReserve">Arrive at chargers with at least<small>Buffer for wind, detours and busy stalls</small></label><select id="setReserve" data-set="reserve"></select></div>
        <div class="frow"><label for="setPrefer">Prefer Superchargers<small>Third-party stops must save real time to win</small></label><input type="checkbox" id="setPrefer" data-set="preferTesla"></div>
        <div class="frow"><label for="setCorridor">Search for chargers within<small>Distance from your route</small></label><select id="setCorridor" data-set="corridor"><option value="1">1 mi of route</option><option value="2">2 mi of route</option><option value="3">3 mi of route</option><option value="5">5 mi of route</option><option value="10">10 mi of route</option></select></div>
        <div class="frow"><label for="setOverhead">Minutes per stop for parking and plugging in</label><input id="setOverhead" type="number" min="0" max="20" step="1" data-set="overhead"></div>
      </fieldset>
      <fieldset>
        <legend>Conditions</legend>
        <div class="frow"><label for="setWeather">Temperature<small>Forecast uses Open-Meteo for each part of the route</small></label><select id="setWeather" data-set="weather"><option value="auto">Forecast along route</option><option value="manual">Set it myself</option></select></div>
        <div class="frow" id="tempRow"><label for="setTemp">Outside temperature (°F)</label><input id="setTemp" type="number" min="-30" max="120" step="1" data-set="manualTempF"></div>
        <div class="frow"><label for="setSpeed">Highway driving</label><select id="setSpeed" data-set="speed"><option value="relaxed">Relaxed (about 65 mph)</option><option value="normal">Normal (about 70–75 mph)</option><option value="fast">Fast (80 mph and up)</option></select></div>
      </fieldset>
      <fieldset>
        <legend>Map and guidance</legend>
        <div class="frow"><label for="setTheme">Appearance</label><select id="setTheme" data-set="theme"><option value="auto">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
        <div class="frow"><label for="setColor">Color the route by battery level</label><input type="checkbox" id="setColor" data-set="colorRoute"></div>
        <div class="frow"><label for="setVoice">Spoken turn-by-turn directions</label><input type="checkbox" id="setVoice" data-set="voice"></div>
        <div class="frow"><label for="setSim">Preview drive with simulated GPS<small>Plays the route back at 12× speed instead of using your location</small></label><input type="checkbox" id="setSim" data-set="simulate"></div>
      </fieldset>
      <fieldset>
        <legend>Charger data</legend>
        <div class="frow stack">
          <label for="setKey">NLR / AFDC API key<small>The shared DEMO_KEY allows a few trips per hour. A free personal key takes a minute: <a href="https://developer.nlr.gov/signup/" target="_blank" rel="noopener">developer.nlr.gov/signup</a>. It’s saved in this browser only, so a second device or copy of the app needs it entered too.</small></label>
          <div class="keyrow"><input id="setKey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your 40-character key" data-set="apiKey"><button type="button" class="btn small" id="checkKey">Check key</button></div>
          <div class="keystat" id="keyStat" role="status" aria-live="polite"></div>
        </div>
      </fieldset>
    </div>
    <div class="dlg-f"><button class="btn primary" value="close" type="submit">Done</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

async function fetchJSON(url, opts = {}, timeoutMs = 25000) {
  const ctrl = new AbortController();
  const outer = opts.signal;
  if (outer) { if (outer.aborted) ctrl.abort(); else outer.addEventListener('abort', () => ctrl.abort(), { once: true }); }
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { ...opts, signal: ctrl.signal });
    if (!r.ok) {
      const err = new Error(`HTTP ${r.status}`);
      err.status = r.status;
      try { err.body = await r.text(); } catch { /* ignore */ }
      throw err;
    }
    return await r.json();
  } finally { clearTimeout(t); }
}

/* Geocoding: Photon (OpenStreetMap), Nominatim as a fallback */
function placeFromPhoton(f) {
  const p = f.properties || {}, c = f.geometry && f.geometry.coordinates;
  if (!c) return null;
  const stc = US[p.state] || p.state || '';
  const locality = p.city || p.town || p.village || p.locality || p.district || '';
  const country = p.countrycode && p.countrycode.toUpperCase() !== 'US' ? p.country : '';
  const isPlace = p.osm_key === 'place' || ['city', 'town', 'village', 'hamlet', 'locality', 'county', 'state', 'district'].includes(p.type);
  const street = p.street ? ((p.housenumber ? p.housenumber + ' ' : '') + p.street) : '';
  let title, sub;
  if (p.name && !isPlace) { title = p.name; sub = [street, locality, stc, country]; }
  else if (p.name) { title = p.name; sub = [['city', 'town', 'village'].includes(p.type) ? '' : locality, stc, country]; }
  else if (street) { title = street; sub = [locality, stc, country]; }
  else { title = locality || stc || 'Selected place'; sub = [stc, country]; }
  sub = [...new Set(sub.filter(Boolean))].filter(x => x !== title).join(', ');
  return { lat: c[1], lng: c[0], title, sub };
}
async function geocode(q, signal, allowFallback = false) {
  const c = map.getCenter();
  const p = new URLSearchParams({ q, limit: '6', lang: 'en', lat: c.lat.toFixed(3), lon: c.lng.toFixed(3) });
  try {
    const j = await fetchJSON('https://photon.komoot.io/api/?' + p, { signal }, 12000);
    return (j.features || []).map(placeFromPhoton).filter(Boolean);
  } catch (e) {
    if ((signal && signal.aborted) || !allowFallback) throw e;
    const n = new URLSearchParams({ format: 'jsonv2', q, limit: '5', addressdetails: '1' });
    const j = await fetchJSON('https://nominatim.openstreetmap.org/search?' + n, { signal }, 12000);
    return (j || []).map(r => {
      const parts = String(r.display_name || '').split(',').map(s => s.trim());
      return { lat: +r.lat, lng: +r.lon, title: r.name || parts[0] || q, sub: parts.slice(1, 4).join(', ') };
    });
  }
}

async function osrmRoute(points, alternatives = false) {

  const q = `?overview=full&geometries=geojson&steps=true${alternatives && points.length === 2 ? '&alternatives=true' : ''}`;

const NLR = ['https://developer.nlr.gov', 'https://developer.nrel.gov'];
/* Keys are 40 letters and numbers; pull one out of whatever got pasted (quotes, spaces, "Your API key is …") */
function cleanKey(v) {
  const t = String(v || '').trim().replace(/^["'`]+|["'`]+$/g, '');
  const m = /[A-Za-z0-9]{40}/.exec(t);
  return m ? m[0] : t.replace(/\s+/g, '');
}
const apiKey = () => cleanKey(S.apiKey) || 'DEMO_KEY';
const keyName = k => k === 'DEMO_KEY' ? 'the shared DEMO_KEY' : `your key ending in ${k.slice(-4)}`;
async function nlr(path, { query = {}, body = null } = {}) {
  const key = apiKey();
  const qs = new URLSearchParams({ api_key: key, ...query });
  let last;
  for (const h of NLR) {
    try {
      const opts = body ? { method: 'POST', body: new URLSearchParams(body) } : {};
      return await fetchJSON(`${h}/api/alt-fuel-stations/v1/${path}?${qs}`, opts, 60000);
    } catch (e) {
      e.key = key;
      e.host = h.replace('https://', '');
      try {
        const j = JSON.parse(e.body || 'null');
        if (j && j.error) { e.code = j.error.code; e.apiMessage = j.error.message; }
        else if (j && j.errors) e.apiMessage = [].concat(j.errors).join(' ');
      } catch { /* body wasn't JSON */ }
      last = e;
      if (e.status && e.status < 500) break; // the server answered; don't hide the real error
    }
  }
  throw last;
}
function nlrError(e) {
  const key = (e && e.key) || apiKey(), demo = key === 'DEMO_KEY', code = e && e.code ? ` (${e.code})` : '';
  if (e && e.status === 429) return demo
    ? 'The shared DEMO_KEY is out of requests for now. Everyone on your network shares it, so it runs out fast. Add your own free key in Settings.'
    : `${keyName(key)[0].toUpperCase() + keyName(key).slice(1)} hit its hourly limit${code}. Wait a few minutes, then try again.`;
  if (e && (e.status === 401 || e.status === 403)) return demo
    ? `The charger service refused the shared DEMO_KEY${code}. Add your own free key in Settings.`
    : `The charger service didn’t accept ${keyName(key)}${code}. Copy it again from the signup email or page. It should be 40 letters and numbers.`;
  if (e && e.status) return `The charger service answered with an error (HTTP ${e.status}${code}). Try again in a minute.`;
  return 'Couldn’t reach the charger database (NLR Alternative Fuels Data Center). Check your connection and try again.';

/* Elevation and temperature: Open-Meteo */
async function fetchElevations(pts) {
  const out = new Array(pts.length).fill(null);
  const need = [];
  pts.forEach((p, i) => {
    const k = p[0].toFixed(3) + ',' + p[1].toFixed(3);
    if (elevCache.has(k)) out[i] = elevCache.get(k); else need.push(i);
  });
  const chunks = [];
  for (let i = 0; i < need.length; i += 100) chunks.push(need.slice(i, i + 100));
  for (let g = 0; g < chunks.length; g += 4) {
    await Promise.all(chunks.slice(g, g + 4).map(async idx => {
      const la = idx.map(i => pts[i][0].toFixed(4)).join(','), lo = idx.map(i => pts[i][1].toFixed(4)).join(',');
      const j = await fetchJSON(`https://api.open-meteo.com/v1/elevation?latitude=${la}&longitude=${lo}`, {}, 20000);
      (j.elevation || []).forEach((e, k) => {
        if (typeof e === 'number' && isFinite(e)) {
          out[idx[k]] = e;
          elevCache.set(pts[idx[k]][0].toFixed(3) + ',' + pts[idx[k]][1].toFixed(3), e);
        }
      });
    }));
  }
  return out;
}
async function fetchWeather(prof, departMs) {

const sug = { el: $('#suggest'), input: null, items: [], active: -1, ctrl: null, timer: null };
function suggestFor(input) {

function renderSuggest(items, note) {

function defaultSuggestions() {

function pickSuggestion(i) {

function parseLatLng(q) {
  const m = /^\s*(-?\d{1,2}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/.exec(q);
  if (!m) return null;

async function runSearch(q, explicit = false) {

for (const input of [$('#fromInput'), $('#toInput')]) {

  });
  input.addEventListener('input', () => {
    suggestFor(input);
    st[input.id === 'fromInput' ? 'from' : 'to'] = null;
    clearTimeout(sug.timer);
    sug.timer = setTimeout(() => runSearch(input.value), 260);
  });
  input.addEventListener('keydown', async e => {
    if (sug.el.hidden && e.key !== 'Enter') return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!sug.items.length) return;
      sug.active = (sug.active + (e.key === 'ArrowDown' ? 1 : -1) + sug.items.length) % sug.items.length;
      $$('li[role=option]', sug.el).forEach((li, i) => li.setAttribute('aria-selected', String(i === sug.active)));

      else if (input.value.trim().length >= 3) {

        await runSearch(input.value, true);
        if (sug.items.length) pickSuggestion(0);

let sheetState = 'half';
function sheetHeights() {
  const H = window.innerHeight, top = $('#topcard').getBoundingClientRect().bottom;
  return { peek: 176, half: Math.round(H * 0.44), full: Math.max(260, Math.round(H - top - 10)) };
}
function setSheet(state) {

function updateTopH() {

(() => {
  const handle = $('#handle'), sheet = $('#sheet');
  let startY = 0, startH = 0, dragging = false, moved = false;
  handle.addEventListener('pointerdown', e => {
    if (!isPhone()) return;
    dragging = true; moved = false; startY = e.clientY; startH = sheet.getBoundingClientRect().height;
    sheet.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dy = e.clientY - startY;
    if (Math.abs(dy) > 4) moved = true;
    const hs = sheetHeights();
    document.documentElement.style.setProperty('--sheet-h', clamp(startH - dy, hs.peek - 40, hs.full) + 'px');
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove('dragging');
    const h = sheet.getBoundingClientRect().height, hs = sheetHeights();
    if (!moved) { setSheet(sheetState === 'peek' ? 'half' : sheetState === 'half' ? 'full' : 'peek'); return; }
    const best = Object.entries(hs).sort((a, b) => Math.abs(a[1] - h) - Math.abs(b[1] - h))[0][0];
    setSheet(best);

})();

    case 'start': startDrive(); break;

    case 'open-settings': openSettings(true); break;
    case 'tab': st.listTab = b.dataset.tab; st.listAll = false; renderAll(); break;
    case 'list-all': st.listAll = true; renderAll(); break;
    case 'load-l2': loadL2(); break;
    case 'here-from':
    case 'here-to': {
      const lat = +b.dataset.lat, lng = +b.dataset.lng;
      map.closePopup();
      const place = (await reverseGeocode(lat, lng)) || { title: 'Dropped pin', sub: `${lat.toFixed(5)}, ${lng.toFixed(5)}` };
      setPlace(act === 'here-from' ? 'from' : 'to', { ...place, lat, lng });
      break;
    }
    case 'example':
    case 'recent': {
      const list = act === 'example' ? window.__examples : store.get('recent', []);
      const t = list[+b.dataset.i];
      if (!t) break;
      if (t.from.isMe) { setPlace('to', t.to, { noPlan: true }); useMyLocation('from'); break; }
      setPlace('from', t.from, { noPlan: true });
      setPlace('to', t.to);
      break;
    }
    case 'filter': {
      const k = b.dataset.k;
      S.filters[k] = !S.filters[k];
      saveSettings();
      renderChips();
      if (k === 'l2' && S.filters.l2 && st.base && !st.l2) loadL2();

async function loadL2() {
  if (!st.base || st.l2Loading) return;
  st.l2Loading = true;
  if (st.listTab === 'l2') renderAll();
  try {
    const line = simplifyTo(st.base.coords, 400);
    const wkt = 'LINESTRING(' + line.map(p => `${p[1].toFixed(5)} ${p[0].toFixed(5)}`).join(', ') + ')';
    const [a, b] = await Promise.all([
      nlr('nearby-route.json', { body: { route: wkt, distance: '1', fuel_type: 'ELEC', status: 'E', access: 'public', ev_charging_level: '2', limit: '200', country: 'all' } }),
      nlr('nearest.json', { query: { latitude: st.to.lat.toFixed(5), longitude: st.to.lng.toFixed(5), radius: '10', fuel_type: 'ELEC', status: 'E', access: 'public', ev_charging_level: '2', limit: '60' } }),
    ]);
    const seen = new Set(st.stations.map(s => s.id)), list = [];
    for (const r of [...(a.fuel_stations || []), ...(b.fuel_stations || [])]) {
      if (seen.has(String(r.id))) continue;
      seen.add(String(r.id));
      const s = parseStation(r);
      if (!isFinite(s.lat)) continue;
      const p = project(st.baseProf, s.lat, s.lng);
      s.x = p.x; s.off = p.off;
      assess(s);
      if (s.a.cat === 'l2' || s.a.cat === 'none') list.push(s);
    }
    st.l2 = list;
    if (!S.filters.l2) { S.filters.l2 = true; saveSettings(); renderChips(); }
    toast(`${list.length} Level 2 chargers loaded`);
  } catch (e) {
    toast(nlrError(e), 5000);
  } finally {
    st.l2Loading = false;
    drawStations(); renderAll();
  }
}

function flatSteps(r) {
  const out = [];
  r.legs.forEach((lg, li) => lg.steps.forEach(s => { if (!(s.type === 'depart' && li > 0)) out.push({ ...s, leg: li }); }));
  return out;
}
async function startDrive() {

  D.steps = flatSteps(st.final);

  $('#navIcon').innerHTML = maneuverIcon({ type: 'depart' });
  $('#navDist').textContent = '—';
  $('#navText').textContent = S.simulate ? 'Preview: following the route at 12× speed' : 'Getting your location…';
  if (S.voice && 'speechSynthesis' in window) speak(st.sim.stops.length ? `Starting route. ${st.sim.stops.length} charging ${st.sim.stops.length === 1 ? 'stop' : 'stops'} planned.` : 'Starting route.');
  try { if (navigator.wakeLock) D.wake = await navigator.wakeLock.request('screen'); } catch { /* not granted */ }
  if (S.simulate) startSimulation();
  else D.watch = navigator.geolocation.watchPosition(onFix, err => {
    $('#navText').textContent = err.code === 1 ? 'Location permission is off. Allow it in your browser to navigate.' : 'Waiting for GPS…';
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}
function endDrive() {
  D.on = false;
  if (D.watch != null) navigator.geolocation.clearWatch(D.watch);
  D.watch = null;
  clearInterval(D.sim); D.sim = null;
  if (D.marker) { map.removeLayer(D.marker); D.marker = null; }
  try { D.wake && D.wake.release(); } catch { /* ignore */ }
  D.wake = null;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.body.classList.remove('driving');
  $('#drive').hidden = true;
  drawRoutes();
  setTimeout(() => { map.invalidateSize(); fitTrip(); }, 60);
}
function startSimulation() {
  let t = 0;
  const step = 0.5, mult = 12;
  D.sim = setInterval(() => {
    const r = st.final;
    t += step * mult;
    const x = xAtSec(r, t);
    const p = pointAtX(r, x), q = pointAtX(r, Math.min(r.distanceMi, x + 0.03));
    onFix({ coords: { latitude: p.lat, longitude: p.lng, accuracy: 6, heading: brg(p.lat, p.lng, q.lat, q.lng), speed: 29 } });
    if (x >= r.distanceMi - 1e-3) { clearInterval(D.sim); D.sim = null; }
  }, step * 1000);
}
function snap(r, lat, lng, hint) {
  const co = r.coords, n = co.length, kx = Math.cos(toRad(lat));
  const scan = (a, b) => {
    let best = { d: Infinity, i: Math.max(0, a), t: 0 };
    for (let i = Math.max(0, a); i < Math.min(n - 1, b); i++) {
      const ax = co[i][1] * kx, ay = co[i][0], bx = co[i + 1][1] * kx, by = co[i + 1][0];
      const px = lng * kx, py = lat, dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
      let t = L2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
      t = clamp(t, 0, 1);
      const ex = ax + t * dx - px, ey = ay + t * dy - py, d = ex * ex + ey * ey;
      if (d < best.d) best = { d, i, t };
    }
    return best;
  };
  let b = scan(hint - 40, hint + 800);
  if (Math.sqrt(b.d) * 69.05 > 0.25) { const g = scan(0, n - 1); if (g.d < b.d) b = g; }
  const i = b.i, j = Math.min(n - 1, i + 1);
  return { i, x: r.cumMi[i] + (r.cumMi[j] - r.cumMi[i]) * b.t, off: Math.sqrt(b.d) * 69.05 };
}
function onFix(p) {
  if (!D.on) return;
  const c = p.coords, r = st.final;
  const s = snap(r, c.latitude, c.longitude, D.idx);
  D.idx = s.i; D.x = s.x;
  D.pos = { lat: c.latitude, lng: c.longitude, acc: c.accuracy || 20, heading: c.heading, speed: c.speed };
  let heading = c.heading;
  if (heading == null || isNaN(heading)) { const a = pointAtX(r, s.x), b = pointAtX(r, Math.min(r.distanceMi, s.x + 0.03)); heading = brg(a.lat, a.lng, b.lat, b.lng); }
  const html = `<div class="nav-arrow" style="transform:rotate(${Math.round(heading)}deg)"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="na" d="M12 2.5 19.5 21 12 17 4.5 21z"/></svg></div>`;
  if (!D.marker) D.marker = L.marker([c.latitude, c.longitude], { icon: L.divIcon({ className: 'me-ic', html, iconSize: [52, 52], iconAnchor: [26, 26] }), interactive: false, zIndexOffset: 1000 }).addTo(map);
  else { D.marker.setLatLng([c.latitude, c.longitude]); const el = D.marker.getElement(); if (el) el.querySelector('.nav-arrow').style.transform = `rotate(${Math.round(heading)}deg)`; }
  if (D.follow) followTo(L.latLng(c.latitude, c.longitude));
  const tol = Math.max(0.06, (D.pos.acc / 1609.344) * 1.5);
  if (!S.simulate && s.off > tol && D.pos.acc < 60) {
    if (++D.offN >= 3 && Date.now() - D.lastReroute > 20000) reroute();
  } else D.offN = 0;
  updateBanner();
}
/* Keep the car in the lower part of the screen so more of the road ahead shows */
function followTo(ll) {
  const fast = (D.pos && D.pos.speed > 20) || S.simulate;
  const z = D.zoomed ? map.getZoom() : (fast ? 14.5 : 16);
  D.zoomed = true;
  const pt = map.project(ll, z).subtract([0, map.getSize().y * 0.2]);
  map.setView(map.unproject(pt, z), z, { animate: !reduceMotion && !S.simulate });
}
function spokenDist(mi) {
  if (mi >= 0.9) return `${Math.round(mi)} ${Math.round(mi) === 1 ? 'mile' : 'miles'}`;
  if (mi >= 0.4) return 'half a mile';
  if (mi >= 0.18) return 'a quarter mile';
  return `${Math.max(100, Math.round(mi * 5280 / 100) * 100)} feet`;
}
function speak(text) {
  if (!S.voice || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 1.02;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function arriveTextFor(leg) {
  const stop = st.sim.stops[leg];
  return stop ? `Arrive at ${stop.st.name}` : `Arrive at ${st.to.title}`;
}
function updateBanner() {
  const steps = D.steps, x = D.x, r = st.final;
  while (D.k < steps.length - 1 && steps[D.k].atMi <= x + 0.008) D.k++;
  const s = steps[D.k];
  if (!s) return;
  const dist = Math.max(0, s.atMi - x);
  const text = instruction(s, { arriveText: arriveTextFor(s.leg) });
  $('#navIcon').innerHTML = maneuverIcon(s);
  $('#navDist').textContent = fmtMi(dist);
  $('#navText').innerHTML = instrHTML(text);
  const nxt = steps[D.k + 1];
  const then = $('#navThen');
  if (nxt && nxt.atMi - s.atMi < 0.3 && s.type !== 'arrive') { then.hidden = false; then.innerHTML = `Then ${instrHTML(instruction(nxt, { arriveText: arriveTextFor(nxt.leg) }))}`; }
  else then.hidden = true;
  /* voice prompts: far warning on highways, near warning, then at the turn */
  const fast = (D.pos && D.pos.speed > 18) || S.simulate;
  const marks = fast ? [1.0, 0.25, 0.04] : [0.25, 0.04];
  const crossed = marks.filter(m => dist <= m && !D.spoken.has(D.k + ':' + m));
  if (crossed.length && s.type !== 'depart') {
    crossed.forEach(m => D.spoken.add(D.k + ':' + m));
    const m = Math.min(...crossed);
    const plain = instrText(text);
    speak(m >= 0.2 ? `In ${spokenDist(dist)}, ${plain}` : plain);
  }
  /* arrival at a charging stop or the destination */
  const legIdx = st.sim.legs.findIndex(l => x <= l.endMi + 0.02);
  const lg = st.sim.legs[legIdx < 0 ? st.sim.legs.length - 1 : legIdx];
  if (lg && lg.endMi - x < 0.03 && !D.arrivedLegs.has(lg.i)) {
    D.arrivedLegs.add(lg.i);
    const stop = st.sim.stops[lg.i];
    if (stop) speak(`Arriving at ${stop.st.name}. Charge to ${Math.round(stop.departSoc)} percent, about ${Math.round(stop.chargeMin)} minutes.`);
    else speak(`You have arrived at ${st.to.title}.`);
  }
  /* bottom bar */
  const tNow = pointAtX(r, x).sec;
  let remainMin = (r.durationSec - tNow) / 60;
  const upcoming = st.sim.stops.filter(p => p.x > x + 0.02);
  remainMin += upcoming.reduce((a, p) => a + p.stayMin, 0);
  const eta = new Date(Date.now() + remainMin * 60e3);
  $('#navEta').textContent = fmtClock(eta, new Date());
  $('#navRemain').textContent = `${fmtMi(Math.max(0, r.distanceMi - x))} · ${fmtDur(remainMin)} left · ~${pct(socAtX(x))} now`;
  const nextStop = upcoming[0];
  $('#navNext').innerHTML = nextStop
    ? `Next charge: <b>${esc(nextStop.st.name)}</b> in ${fmtMi(nextStop.x - x)} · arrive ~${pct(nextStop.arriveSoc)}, charge to ${pct(nextStop.departSoc)}`
    : `No more charging · arrive with ~${pct(st.sim.arriveSoc)}`;
}
async function reroute() {
  D.lastReroute = Date.now(); D.offN = 0;
  toast('Off route. Finding a new way…');
  const r = st.final, x = D.x;
  const nowSoc = socAtX(x);
  const remaining = st.sim.stops.filter(p => p.x > x + 0.05);
  try {
    const [nr] = await osrmRoute([{ lat: D.pos.lat, lng: D.pos.lng }, ...remaining.map(p => p.st), st.to]);
    if (!D.on) return;
    const prof = makeProfile(nr);
    borrowElevation(prof, st.baseProf);
    applyWeather(prof, st.wx, Date.now());
    computeEnergy(prof);
    const infos = remaining.map(p => ({ st: p.st, T: chargeTable(effKw(p.st)) }));
    st.final = nr; st.finalProf = prof;
    st.sim = simulate(nr, prof, infos, remaining.map(p => p.departSoc), clamp(nowSoc, 1, 100));
    D.steps = flatSteps(nr); D.k = 0; D.idx = 0; D.spoken.clear(); D.arrivedLegs.clear();
    drawRoutes(); drawStops();
    hideToast();
  } catch (e) {
    toast('Couldn’t reroute. Keep following the line or open Google Maps.', 4000);

}

/* =====================================================================
   Toast
   ===================================================================== */
let toastTimer = null;
function toast(msg, ms = 2600) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, ms);
}
function hideToast() { $('#toast').classList.remove('show'); }

/* =====================================================================
   Init
   ===================================================================== */
function initIcons() {
  $('#settingsBtn').innerHTML = ic('sliders');
  $('#compactSettings').innerHTML = ic('sliders');
  $('#locateFrom').innerHTML = ic('locate');
  $('#swapBtn').innerHTML = ic('swap');
  $('#layersBtn').innerHTML = ic('layers');
  $('#locateBtn').innerHTML = ic('me');
  $('#setClose').innerHTML = ic('close');
}
function initDepart() {
  const d = new Date(Date.now() + 5 * 60e3);
  d.setMinutes(Math.ceil(d.getMinutes() / 5) * 5, 0, 0);
  const pad = n => String(n).padStart(2, '0');
  $('#departAt').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function init() {
  initIcons(); initDepart(); syncBattery(); syncSettingsForm();
  renderCarChip(); renderChips(); updateCompact();
  applyTheme();
  setSheet(isPhone() ? 'half' : 'half');
  updateTopH();
  if (readHash()) { drawEndpoints(); planRoute(); }
  else {
    renderEmpty();
    if (navigator.permissions && navigator.geolocation) {
      navigator.permissions.query({ name: 'geolocation' }).then(p => {
        if (p.state === 'granted' && !st.from) myLocation().then(async loc => {
          showMe(loc);
          map.setView([loc.lat, loc.lng], 11);
          const near = await reverseGeocode(loc.lat, loc.lng);
          if (!st.from) setPlace('from', { lat: loc.lat, lng: loc.lng, title: 'Your location', sub: near ? [near.title, near.sub].filter(Boolean).join(', ') : '', isMe: true }, { noPlan: true });
        }).catch(() => {});
      }).catch(() => {});
    }
  }
}
window.ChargeLine = { st, get S() { return S; }, car, solve, buildNodes, simulate, planRoute, normRoute, makeProfile };
init();
})();
</script>
